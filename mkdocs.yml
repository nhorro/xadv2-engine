site_name: Extraordinary Adventures Engine
site_description: >-
  Documentation for xadv2-engine — a C++20 / SFML 2D game engine with Lua
  scripting, YAML data, and an optional point-and-click adventure kit.
site_author: Nicolás Horro
repo_url: https://github.com/nhorro/xadv2-engine
repo_name: nhorro/xadv2-engine
edit_uri: edit/develop/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

plugins:
  - search

exclude_docs: |
  requirements.txt
  development/history/design/build-pdf.sh

not_in_nav: |
  README.md
  development/history/design/README.md
  development/history/README.md

nav:
  - Home: index.md
  - Engine:
      - development/index.md
      - Architecture tour:
          - Index: development/tour/index.md
          - Design drivers: development/tour/00-drivers.md
          - Core abstractions: development/tour/01-core-abstractions.md
          - Point & click kit: development/tour/02-point-and-click.md
      - Plans and technical debt:
          - Target and debt: development/plans/target-and-debt.md
          - Proposed code layout and Doxygen: development/plans/code-layout.md
      - Coding guides:
          - Conventions & formatting: development/coding-conventions.md
      - Internals:
          - SCUMM command flow: development/scumm-command-flow.md
      - Historical design:
          - History note: development/history/README.md
          - Index: development/history/design/00-index.md
          - Engine requirements: development/history/design/01-engine-requirements.md
          - Architecture overview: development/history/design/02-architecture-overview.md
          - Generic 2D concepts: development/history/design/03-2d-game-concepts.md
          - Point & click concepts: development/history/design/04-point-and-click-concepts.md
          - Scripting API: development/history/design/05-scripting-api.md
          - Data formats: development/history/design/06-data-formats.md
          - Implementation plan: development/history/design/implementation-plan.md
          - Old C++ engine guide: development/history/cpp-engine-guide.md
          - Old Lua authoring guide: development/history/lua-game-guide.md
  - Authoring API:
      - authoring/index.md
      - Building a game: authoring/building-a-game.md
      - Gameplay recording: authoring/gameplay-recording.md
      - Lua API reference: authoring/lua-api.md
      - Data formats: authoring/data-formats.md
      - Game and chapter manifests: authoring/chapter-manifests.md
      - Scriptable scenes: authoring/script-scenes.md
      - Localization: authoring/localization.md
      - Scenery authoring: authoring/scenery.md
      - Lighting, shadows & grading: authoring/room-lighting-tutorial.md
