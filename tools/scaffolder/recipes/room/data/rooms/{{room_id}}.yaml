# Room {{room_id}}, generated by `tools.scaffolder add room`.
# Replace the flat colour with background layers, then use the room editor to
# trace the final walkable area, hotspots, points, and scenery objects.

version: 1
id: {{room_id}}

background:
  color: { r: 24, g: 28, b: 40 }

# Default 1280x592 scenery viewport used by a 1280x720 game with the stock
# SCUMM panel. Adjust this geometry if the project's virtual layout differs.
walkable:
  - { x:    0, y: 360 }
  - { x: 1280, y: 360 }
  - { x: 1280, y: 592 }
  - { x:    0, y: 592 }

points:
  player_start: { x: 640, y: 552 }

avatars:
  - id: player
    start: player_start
    orientation: down
    player: true

