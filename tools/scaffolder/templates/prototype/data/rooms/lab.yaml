# A bare room used as a shader/mechanics sandbox for {{title}}. No background
# image: the `background.color` fills the scenery viewport, so the room is a
# clean canvas. The walkable polygon covers the whole scenery area; drop
# hotspots, regions, objects, and shaders here to test ideas in isolation.

version: 1
id: lab

background:
  color: { r: 24, g: 28, b: 40 }

# Whole-scenery walkable rectangle. With the stock SCUMM panel, a 1280x720
# game's scenery viewport ends at y=592. Keep this in sync with the panel layout
# if the prototype changes it.
walkable:
  - { x:    0, y:  360 }
  - { x: 1280, y:  360 }
  - { x: 1280, y:  592 }
  - { x:    0, y:  592 }

points:
  player_start: { x: 640, y: 552 }

avatars:
  - id: player
    start: player_start
    orientation: down
    player: true
