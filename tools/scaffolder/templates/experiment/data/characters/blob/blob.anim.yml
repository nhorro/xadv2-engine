# Minimal animation rig for the placeholder. One stand sequence is enough —
# the Avatar's animation lookup falls back from `<action>_<direction>` to the
# bare action and finally to `stand` / `idle`, so move_to + face work even
# without directional variants.
version: 1
spritesheet: blob.yml
pivot: walking_pivot

sequences:
  stand:
    loop: true
    frames:
      - { sprite: stand, duration: 0.20 }
