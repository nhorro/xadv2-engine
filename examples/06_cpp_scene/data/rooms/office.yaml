version: 1
id: office

background:
  color: { r: 18, g: 24, b: 28 }
  layers:
    - id: room
      image: /backgrounds/office.png
      z: 0

walkable:
  - { x:   40, y: 435 }
  - { x: 1240, y: 435 }
  - { x: 1240, y: 600 }
  - { x:   40, y: 600 }

points:
  player_start: { x: 300, y: 570 }
  at_desk:      { x: 540, y: 520 }
  at_board:     { x: 960, y: 530 }

hotspots:
  desk:
    name: "the desk"
    area: [{x: 380, y: 340}, {x: 700, y: 340}, {x: 700, y: 440}, {x: 380, y: 440}]
    approach: at_desk
    default_verb: look_at
    affordances: [look_at, open]

  board:
    name: "the pin board"
    area: [{x: 830, y: 130}, {x: 1120, y: 130}, {x: 1120, y: 330}, {x: 830, y: 330}]
    approach: at_board
    default_verb: look_at
    affordances: [look_at]

avatars:
  - id: player
    start: player_start
    orientation: down
    player: true
