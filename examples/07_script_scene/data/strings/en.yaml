# inline in the room / dialog / inventory files.
version: 1
language: en

verbs:
  look_at: "Look at"
  talk_to: "Talk to"
  pick_up: "Pick up"
  use:     "Use"
  give:    "Give"
  open:    "Open"
  close:   "Close"
