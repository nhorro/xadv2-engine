# Last-resort captions: what the player hears when nothing — not the hotspot,
# not the item, not the game-wide fallback — handled the command.
defaults:
  cant_look_at:      "I see nothing special."
  cant_pick_up:      "I can't pick that up."
  wont_open:         "It won't open."
  wont_close:        "It won't close."
  wont_push:         "I can't push that."
  wont_pull:         "I can't pull that."
  cant_use_that_way: "That doesn't work."
  no_one_to_give_to: "There's no one to give it to."
  nothing_to_say:    "Nothing to say."
  nothing_happens:   "Nothing happens."
