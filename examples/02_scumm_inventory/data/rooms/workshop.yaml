version: 1
id: workshop

background:
  color: { r: 20, g: 22, b: 32 }
  layers:
    - id: room
      image: /backgrounds/interior.png
      z: 0

walkable:
  - { x:   40, y: 440 }
  - { x: 1240, y: 440 }
  - { x: 1240, y: 600 }
  - { x:   40, y: 600 }

points:
  player_start: { x: 500, y: 560 }
  from_yard:    { x: 1060, y: 540 }
  at_bench:     { x: 540, y: 500 }
  at_door:      { x: 1050, y: 520 }

hotspots:
  # The key sits on the bench. `pick_up` moves it into the inventory and the
  # handler disables this hotspot, so it can't be picked up twice.
  key:
    name: "a key"
    area: [{x: 470, y: 330}, {x: 560, y: 330}, {x: 560, y: 360}, {x: 470, y: 360}]
    approach: at_bench
    default_verb: pick_up
    affordances: [look_at, pick_up]

  bench:
    name: "the workbench"
    area: [{x: 420, y: 360}, {x: 660, y: 360}, {x: 660, y: 432}, {x: 420, y: 432}]
    approach: at_bench
    default_verb: look_at
    affordances: [look_at, push]

  door:
    name: "the door"
    area: [{x: 1000, y: 170}, {x: 1150, y: 170}, {x: 1150, y: 432}, {x: 1000, y: 432}]
    approach: at_door
    default_verb: open
    affordances: [look_at, open, use]

avatars:
  - id: player
    start: player_start
    orientation: down
    player: true
