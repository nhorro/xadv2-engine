version: 1
id: yard

background:
  color: { r: 16, g: 20, b: 34 }
  layers:
    - id: room
      image: /backgrounds/yard.png
      z: 0

walkable:
  - { x:   40, y: 420 }
  - { x: 1240, y: 420 }
  - { x: 1240, y: 600 }
  - { x:   40, y: 600 }

points:
  player_start: { x: 640, y: 560 }
  at_gate:      { x: 200, y: 500 }

hotspots:
  gate:
    name: "the gate"
    area: [{x: 90, y: 190}, {x: 250, y: 190}, {x: 250, y: 420}, {x: 90, y: 420}]
    approach: at_gate
    default_verb: look_at
    affordances: [look_at, open]

avatars:
  - id: player
    start: player_start
    orientation: down
    player: true
