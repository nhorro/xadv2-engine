# CI: build + headless tests.
#
#   * Ubuntu 24.04 (the dev OS) — system deps via apt, runs on every branch.
#   * Windows 2022 (the primary release target, R7) — deps via vcpkg manifest,
#     runs on PRs and on develop/main pushes to keep runner minutes in check.
#
# Headless only: the doctest+CTest suite never opens a window, so no xvfb is
# needed on Linux. The themummy SFML smoke run (--frames N) does create a window
# and is therefore omitted here — add it (xvfb-run on Linux) in a follow-up.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

# Newer pushes to the same ref cancel still-running builds; the merge result
# is what matters, intermediate states aren't worth burning runner minutes on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libsfml-dev \
            liblua5.4-dev \
            libyaml-cpp-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  build-and-test-windows:
    name: Build and test (Windows 2022)
    runs-on: windows-2022
    # Skip the slow vcpkg build on routine topic-branch pushes; still gate every PR
    # and the integration branches.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    env:
      # CI builds/tests Release only, so use a release-only overlay triplet (skips
      # debug copies of every dep — roughly halves the cold build).
      VCPKG_TARGET_TRIPLET: x64-windows-rel
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg-triplets
      # vcpkg's per-package binary cache; persisted across runs by the cache steps.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up vcpkg env
        # VCPKG_INSTALLATION_ROOT is a runner env var (vcpkg is pre-installed); it
        # is not in the ${{ env.* }} context, so surface it as VCPKG_ROOT for the
        # preset's $env{VCPKG_ROOT} toolchain reference.
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('vcpkg.json', '.github/vcpkg-triplets/x64-windows-rel.cmake') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-

      - name: Pin vcpkg baseline
        # The committed manifest omits builtin-baseline (no fixed SHA available
        # offline); add the runner's vcpkg baseline so the sfml 2.6.1 override resolves.
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" x-update-baseline --add-initial-baseline

      - name: Configure
        run: cmake --preset windows-msvc "-DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TARGET_TRIPLET }}"

      - name: Build
        run: cmake --build --preset windows-msvc-release

      - name: Save vcpkg binary cache
        # Split restore/save with always() so newly built packages persist even when
        # the build or tests fail — the combined cache action skipped saving on
        # failed runs, so every run rebuilt all deps from scratch.
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Run tests
        run: ctest --preset windows-msvc-release
