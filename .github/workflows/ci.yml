# CI: build + headless tests.
#
#   * Ubuntu 24.04 (the dev OS) — system deps via apt; runs on PRs to develop/main
#     and on develop/main pushes. Topic-branch pushes no longer trigger a build on
#     their own — open a PR (or push to develop/main) to get CI. This keeps the
#     private-repo Actions minute spend bounded.
#   * Windows 2022 (the primary release target, R7) — deps via vcpkg manifest; the
#     2x-cost runner runs only on develop/main pushes and manual dispatch (skipped
#     on PRs). Trigger a manual run to exercise Windows on a PR before merging.
#
# Two tiers of tests. The doctest+CTest suite never opens a window and runs bare.
# The examples DO open one (SFML needs a GL context even for `--frames 5`), so
# they carry the `gui` label and run under xvfb: `ctest -LE gui` then
# `xvfb-run ctest -L gui`.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # Manual trigger — handy to run the Windows job on demand (e.g. to validate a
  # PR on the primary target before merging, since PRs skip it).
  workflow_dispatch:

# Newer pushes to the same ref cancel still-running builds; the merge result
# is what matters, intermediate states aren't worth burning runner minutes on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libsfml-dev \
            liblua5.4-dev \
            libyaml-cpp-dev \
            xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests (headless)
        run: ctest --test-dir build --output-on-failure --label-exclude gui

      - name: Smoke-run the examples (windowed, under xvfb)
        run: xvfb-run -a ctest --test-dir build --output-on-failure --label-regex gui

      # The engine's whole point is to be consumable by a game in another
      # repository. Installs it to a throwaway prefix and builds an external
      # project against it, both ways: find_package(pac_engine) and
      # add_subdirectory(<engine>). Without this the export rots silently.
      - name: Check packaging (install + find_package, and source mode)
        run: ./scripts/check-packaging.sh

  build-and-test-windows:
    name: Build and test (Windows 2022)
    runs-on: windows-2022
    # The 2x-cost Windows runner is the biggest minute sink, so run it only where it
    # earns its keep: the integration branches (develop/main pushes) and explicit
    # manual dispatch. PRs are covered by the Linux job; trigger a manual run if you
    # need Windows coverage on a PR before merging.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    env:
      # CI builds/tests Release only, so use a release-only overlay triplet (skips
      # debug copies of every dep — roughly halves the cold build).
      VCPKG_TARGET_TRIPLET: x64-windows-rel
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg-triplets
      # vcpkg's per-package binary cache; persisted across runs by the cache steps.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up vcpkg env
        # VCPKG_INSTALLATION_ROOT is a runner env var (vcpkg is pre-installed); it
        # is not in the ${{ env.* }} context, so surface it as VCPKG_ROOT for the
        # preset's $env{VCPKG_ROOT} toolchain reference.
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('vcpkg.json', '.github/vcpkg-triplets/x64-windows-rel.cmake') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-

      - name: Pin vcpkg baseline
        # The committed manifest omits builtin-baseline (no fixed SHA available
        # offline); add the runner's vcpkg baseline so the sfml 2.6.1 override resolves.
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" x-update-baseline --add-initial-baseline

      - name: Configure
        run: cmake --preset windows-msvc "-DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TARGET_TRIPLET }}"

      - name: Build
        run: cmake --build --preset windows-msvc-release

      - name: Save vcpkg binary cache
        # Split restore/save with always() so newly built packages persist even when
        # the build or tests fail — the combined cache action skipped saving on
        # failed runs, so every run rebuilt all deps from scratch.
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Run tests
        # Headless suite only: the example smoke runs open a window (label `gui`),
        # and the Windows runner has no reliable GL context for one.
        run: ctest --preset windows-msvc-release --label-exclude gui
