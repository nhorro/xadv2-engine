# A bare room used as a shader/mechanics sandbox. No background image: the
# `background.color` fills the scenery viewport, so the room is a clean
# canvas. The walkable polygon covers the whole scenery area; drop hotspots,
# regions, objects, and shaders here to test ideas in isolation.

version: 1
id: lab

background:
  color: { r: 24, g: 28, b: 40 }

# Whole-scenery walkable rectangle. The scenery viewport is the top portion of
# the virtual resolution above the SCUMM panel (~640/720 of 720). Keep this in
# sync with the virtual resolution in game.yaml if you change it.
walkable:
  - { x:    0, y:  400 }
  - { x: 1280, y:  400 }
  - { x: 1280, y:  640 }
  - { x:    0, y:  640 }

points:
  player_start: { x: 640, y: 600 }

avatars:
  - id: player
    start: player_start
    orientation: down
    player: true
