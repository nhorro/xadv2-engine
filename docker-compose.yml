# Docker environments for xadv2-engine (issue #125).
#
#   engine       build + run the sample game           (needs X11 on the host)
#   engine-test  build + run the headless test suite    (no display needed)
#   room-editor  the web-based room YAML editor         (browser -> localhost:8000)
#   tools        interactive shell with the Python tools + the repo mounted
#
# Quick start:
#   docker compose run --rm engine-test          # build the engine, run tests
#   docker compose up room-editor                # then open http://localhost:8000
#   xhost +local: && docker compose run --rm engine   # run the game (X11)
#
# See docker/README.md for X11 setup and per-tool commands.

services:
  engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    image: xadv2-engine
    # Share the host X11 display (window) and PulseAudio/PipeWire socket (sound).
    # Run `xhost +local:` on the host first to authorize the container. The pulse
    # socket + cookie come from the host's runtime/config dirs; this works on both
    # PulseAudio and PipeWire (via its pulse-compat socket) desktops.
    environment:
      DISPLAY: ${DISPLAY:-:0}
      PULSE_SERVER: unix:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:rw
      - ${HOME}/.config/pulse/cookie:/root/.config/pulse/cookie:ro

  # Standalone (not extending `engine`) so the headless test path never inherits
  # the host X11 / audio bind mounts — keeps it portable for CI.
  engine-test:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    image: xadv2-engine
    command: ctest --test-dir build --output-on-failure

  room-editor:
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    image: xadv2-tools
    ports:
      - "8000:8000"
    # Edit room YAML on the host; the tool code comes from the image.
    volumes:
      - ./games:/work/games

  tools:
    image: xadv2-tools
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    # Whole repo mounted for ad-hoc CLI tool runs (packers, avatarmaker, ...).
    volumes:
      - .:/work
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
