scumm_panel:
  design_size: [1280, 720]

  # Coordinate rules:
  # - panel.rect is in design_size coordinates.
  # - command_bar.rect and body.rect are relative to panel.rect.
  # - verb_panel.rect and inventory_panel.rect are relative to body.rect.
  # - inventory arrow hitboxes are relative to inventory_panel.rect.
  layout:
    panel:
      rect: [0, 612, 1280, 108]
      padding: [10, 10, 10, 10]
      background:
        type: solid
        color: "#1a181f"

    command_bar:
      rect: [0, 0, 1280, 32]
      text_align: center

    body:
      rect: [10, 42, 1260, 56]
      gap: 10

    verb_panel:
      rect: [0, 0, 569, 56]
      rows: 3
      columns: 3
      padding: [0, 0, 0, 0]
      cell_gap: [0, 0]

    inventory_panel:
      rect: [589, 0, 671, 56]
      rows: 2
      columns: 4
      padding: [0, 0, 52, 0]
      cell_gap: [8, 0]

    # mode:
    # - draw: the engine renders arrow labels and uses the hitboxes below.
    # - background_variants: arrows are part of background images, hitboxes still work.
    # - none: arrows are neither drawn nor interactive.
    inventory_arrows:
      mode: draw
      placement: right
      previous:
        hitbox: [619, 0, 24, 56]
      next:
        hitbox: [645, 0, 24, 56]

  content:
    verbs:
      - look_at
      - open
      - push
      - talk_to
      - close
      - pull
      - pick_up
      - use
      - give

  skin:
    command_text:
      size: 20
      color: "#f2e0b0"
      align: center

    verb_text:
      size: 16
      color: "#d2d5e2"
      hover_color: "#f8faff"
      disabled_color: "#888888"
      align: center

    inventory_text:
      size: 18
      color: "#cad0e0"
      hover_color: "#f8faff"
      disabled_color: "#888888"
      align: center

    arrows:
      draw:
        previous_text: "<"
        next_text: ">"
        size: 22
        color: "#d2d5e2"
        hover_color: "#f8faff"
        disabled_color: "#888888"
