# Close-up / examine view of the sarcophagus on the cart in the hall (issue #76).
# Opened from hall.lua via open_closeup("sarcophagus_closeup"); backing out
# (Esc / right-click) pops back to the hall with its state intact.
version: 1
id: sarcophagus_closeup

# Full-screen background. Reuses the cart art; background_color shows through any
# transparent border when the image is scaled to the virtual resolution.
background: rooms/b/background/01.png
background_color: { r: 20, g: 16, b: 12 }

hotspots:
  lid:
    name: "la tapa del sarcófago"
    area:
      - { x: 380, y: 150 }
      - { x: 900, y: 150 }
      - { x: 900, y: 560 }
      - { x: 380, y: 560 }
  glint:
    name: "algo brilla en una ranura"
    area:
      - { x: 950, y: 300 }
      - { x: 1140, y: 300 }
      - { x: 1140, y: 470 }
      - { x: 950, y: 470 }
