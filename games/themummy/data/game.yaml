# The Mummy — example game manifest (M0: title + settings + blank gameplay stub).
version: 1
id: themummy

resolution: { width: 1280, height: 720 }

window:
  fullscreen: false
  width: 1280
  height: 720

# Resource root, resolved relative to this manifest's directory.
resources:
  src: "."

# UI-strings languages (#72). The MVP ships Spanish only; the list is design-ready
# for more. The first entry is the default unless `default_language` overrides it.
# A single-language game may instead use the shorthand `strings: strings/es.yaml`.
languages:
  - id: es
    name: "Español"
    strings: strings/es.yaml

# Custom point-and-click cursor (#73). `interact` is shown over hotspots;
# `hotspot` is the active click pixel within both images.
cursor:
  image: ui/cursor.png
  interact: ui/cursor_interact.png
  hotspot: { x: 1, y: 1 }

settings:
  audio:
    music_volume: 0.8
    sfx_volume: 0.8

development:
  # edit_mode is the master gate for the in-room debug overlays (#37). With it on,
  # toggle layers at runtime: F1 walkboxes, F2 hotspots, F3 anchors/z, F4 state HUD.
  # The show_* flags below seed each layer's initial on/off state.
  edit_mode: true
  show_walkboxes: true
  show_hotspots: false
  show_anchors: false
  show_state: false
  allow_room_reload: true

entry: title
#entry: room_view

scenes:
  - id: title
    type: TitleScreen
    parameters:
      background: title/title_screen.png   # full-screen image; solid black if omitted
      font: fonts/DepartureMono-Regular.otf
      font_size: 30
      music: title/title.mp3               # played in a loop
      menu:
        position: {x: 0.5, y: 0.8}         # menu anchor as a fraction of the screen
        options:
          new_game: intro
          continue: room_view
          # Optional `load_game` outcome (#108): when present and a save exists,
          # the title adds a "Recuperar partida" entry that opens the load
          # picker. Any non-empty value enables the entry — the picker's
          # internal goto target is set by SaveLoadScene's `room_scene` param.
          load_game: room_view
          exit: QUIT

  - id: settings
    type: SettingsScene
    parameters:
      background: settings/settings.png   # full-screen image; dark fill if omitted
      font: fonts/DepartureMono-Regular.otf
      font_size: 20

  - id: save
    type: SaveLoadScene
    parameters:
      mode: save
      background: settings/settings.png   # shares the settings backdrop (#108)
      font: fonts/DepartureMono-Regular.otf
      font_size: 22

  - id: load
    type: SaveLoadScene
    parameters:
      mode: load
      background: settings/settings.png
      font: fonts/DepartureMono-Regular.otf
      font_size: 22

  - id: intro
    type: StoryText
    parameters:
      script: scripts/intro.lua
      on_finish: room_view
      font: fonts/DepartureMono-Regular.otf

  - id: room_view
    type: RoomScene
    parameters:
      cast: cast.yaml
      rooms: rooms
      start_room: hall
      player: julia
      font: fonts/DepartureMono-Regular.otf
      scumm_panel: ui/scumm_panel_default.yml
      inventory: inventory.yaml
      inventory_logic: inventory.lua
      logic: game.lua

  - id: sarcophagus_closeup
    type: CloseUp
    parameters:
      data: closeups/sarcophagus.yaml
      font: fonts/DepartureMono-Regular.otf
