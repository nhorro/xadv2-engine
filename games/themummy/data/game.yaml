# The Mummy — example game manifest (M0: title + settings + blank gameplay stub).
version: 1
id: themummy

resolution: { width: 1280, height: 720 }

window:
  fullscreen: false
  width: 1280
  height: 720

# Resource root, resolved relative to this manifest's directory.
resources:
  src: "."

strings: strings/es.yaml

settings:
  audio:
    music_volume: 0.8
    sfx_volume: 0.8

development:
  edit_mode: false
  show_walkboxes: false
  show_hotspots: false
  allow_room_reload: true

#entry: title
entry: room_view

scenes:
  - id: title
    type: TitleScreen
    parameters:
      new_game: intro
      continue: room_view
      exit: QUIT
      font: fonts/scumm.ttf

  - id: settings
    type: SettingsScene
    parameters:
      font: fonts/scumm.ttf

  - id: intro
    type: StoryText
    parameters:
      script: scripts/intro.lua
      on_finish: room_view
      font: fonts/scumm.ttf

  - id: room_view
    type: RoomScene
    parameters:
      cast: cast.yaml
      rooms: rooms
      start_room: study
      player: julia
      font: fonts/scumm.ttf
      inventory: inventory.yaml
      inventory_logic: inventory.lua
      logic: game.lua
