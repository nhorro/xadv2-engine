# The Mummy — example game manifest (M0: title + settings + blank gameplay stub).
version: 1

resolution: { width: 1280, height: 720 }

window:
  fullscreen: false
  width: 1280
  height: 720

# Resource root, resolved relative to this manifest's directory.
resources:
  src: "."

strings: strings/es.yaml

settings:
  audio:
    music_volume: 0.8
    sfx_volume: 0.8

development:
  edit_mode: false
  show_walkboxes: false
  show_hotspots: false
  allow_room_reload: true

entry: title

scenes:
  - id: title
    type: TitleScreen
    parameters:
      new_game: gameplay
      exit: QUIT
      font: fonts/scumm.ttf

  - id: settings
    type: SettingsScene
    parameters:
      font: fonts/scumm.ttf

  # M0 placeholder for "game started"; replaced by a RoomScene in M3+.
  - id: gameplay
    type: Blank
