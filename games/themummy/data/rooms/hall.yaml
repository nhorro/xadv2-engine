# Hall / hub (scrolls: 1916 wide > scenery viewport). Doors: DIRECCION (right) ->
# study, SALIDA (center) -> exterior (locked until the key is used). The cart is a
# region (present/gone) hiding the key.
version: 1
id: hall
size: { width: 1916, height: 821 }

background:
  color: { r: 0, g: 0, b: 0 }
  layers:
    - id: hall
      image: b/background/00.png
      z: 0

walkable:
  - { x: 60,   y: 565 }
  - { x: 1850, y: 565 }
  - { x: 1850, y: 800 }
  - { x: 60,   y: 800 }

points:
  player_start:   { x: 380, y: 720 }
  from_study:     { x: 1740, y: 700 }
  from_exterior:  { x: 950, y: 660 }
  at_cart:        { x: 980, y: 720 }
  at_salida:      { x: 950, y: 640 }

zones:
  - id: to_study
    polygon: [ {x: 1830, y: 565}, {x: 1916, y: 565}, {x: 1916, y: 800}, {x: 1830, y: 800} ]
  - id: to_exterior
    polygon: [ {x: 840, y: 565}, {x: 1060, y: 565}, {x: 1060, y: 630}, {x: 840, y: 630} ]

regions:
  cart:
    area: [ {x: 700, y: 360}, {x: 1402, y: 360}, {x: 1402, y: 761}, {x: 700, y: 761} ]
    z: 700
    states:
      present: b/background/01.png
      gone: ""
    initial: present

hotspots:
  cart:
    name: "el carro"
    area: [ {x: 760, y: 380}, {x: 1340, y: 380}, {x: 1340, y: 740}, {x: 760, y: 740} ]
    approach: at_cart
    affordances: [ look_at, push ]
  salida:
    name: "la puerta de salida"
    area: [ {x: 840, y: 90}, {x: 1060, y: 90}, {x: 1060, y: 560}, {x: 840, y: 560} ]
    approach: at_salida
    affordances: [ look_at, open, use ]

avatars:
  - { id: julia, start: player_start, orientation: down, player: true }
