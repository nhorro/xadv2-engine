version: 1
id: exterior
background:
  color:
    r: 24
    g: 28
    b: 40
  layers:
  - id: background
    image: exterior/00.png
    z: 0
perspective:
  top:
    y: 300
    scale: 0.4
  bottom:
    y: 640
    scale: 0.9
walkable: [{x: 249, y: 482}, {x: 204, y: 405}, {x: 150, y: 358}, {x: 293, y: 366}, {x: 473, y: 354}, {x: 484, y: 339}, {x: 561, y: 334}, {x: 581, y: 354}, {x: 641, y: 363}, {x: 676, y: 350}, {x: 780, y: 364}, {x: 894, y: 371}, {x: 965, y: 370}, {x: 1005, y: 381}, {x: 1033, y: 398}, {x: 1085, y: 402}, {x: 1307, y: 406}, {x: 1301, y: 450}, {x: 1263, y: 467}, {x: 1169, y: 478}, {x: 1095, y: 518}, {x: 1063, y: 608}, {x: 443, y: 602}, {x: 416, y: 512}]
points:
  player_start: {x: 640, y: 600}
  from_hall: {x: 516, y: 346}
  at_door: {x: 507, y: 346}
  delivery_guy_start: {x: 632, y: 405}
# delivery_guy is NOT a declared avatar: he is spawned per configuration by
# exterior.lua (spawn_npc in CFG_DELIVERY). Only the player is always present.
avatars:
- id: player
  start: player_start
  orientation: down
  player: true
# Named so configure() in exterior.lua can toggle them with the box/truck per act
# (#143). Start disabled: CFG_EMPTY has nothing on the floor, so the walking area
# is fully clear until the delivery shows up.
obstacles:
- { id: box_block,   enabled: false, area: [{x: 367, y: 390}, {x: 365, y: 354}, {x: 460, y: 354}, {x: 461, y: 390}] }
- { id: truck_block, enabled: false, area: [{x: 739, y: 490}, {x: 740, y: 469}, {x: 1235, y: 466}, {x: 1244, y: 485}] }
zones: []
regions: {}

# box and truck are objects (was layers) so configure() in exterior.lua can
# show/hide them per configuration. `position` is the top-left (same value the
# layers used as `origin`); visibility persists and is driven by the room cfg,
# so they start hidden (CFG_EMPTY). Sprite paths resolve relative to the rooms
# dir, identical to the old layer paths.
objects:
  box:
    sprite: exterior/objects/box.png
    position: {x: 368, y: 244}
    z: 388
    scale: 0.614
    visible: false
  truck:
    sprite: exterior/objects/truck.png
    position: {x: 738, y: 278}
    z: 487
    visible: false

hotspots:
  # NPC hotspot (issue #141): `bind: npc:delivery_guy` tracks his moving bounds
  # and is inactive when he isn't spawned (CFG_EMPTY / CFG_BOX). Handlers live in
  # exterior.lua (currently commented).
  delivery_guy:
    name: repartidor
    bind: npc:delivery_guy
    affordances:
    - look_at
    - talk_to
  door:
    name: puerta
    area: [{x: 489, y: 211}, {x: 490, y: 334}, {x: 547, y: 334}, {x: 550, y: 211}]
    approach: at_door
    affordances:
    - look_at
    - use
  # box/truck hotspots bind to their objects (no fixed `area`) so they are
  # inactive whenever the object is hidden (hit region = the object's sprite
  # bounds). Re-add an explicit `area` only if you want a hit region different
  # from the sprite rect.
  box:
    name: caja
    bind: object:box
    affordances:
    - look_at
    - use
    - open
    - close
    - push
    - pull
  truck:
    name: camioneta del repartidor
    bind: object:truck
    affordances:
    - look_at
    - use
    - open
    - push
