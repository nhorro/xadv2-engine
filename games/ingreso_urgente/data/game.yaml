# Game manifest for Ingreso Urgente (ingreso_urgente). Wires every built-in scene the
# engine ships: title, settings, save+load pickers, an intro cutscene, and a
# starting room. Edit the scene parameters below; the engine looks up each by
# id, so renaming requires keeping the cross-references in sync.

version: 1
id: ingreso_urgente

resolution: { width: 1280, height: 720 }
window:
  fullscreen: true
  width: 1280
  height: 720

resources:
  src: "."

languages:
  - id: es
    name: "Español"
    strings: strings/es.yaml

settings:
  audio:
    music_volume: 0.8
    sfx_volume: 0.8

#entry: title
entry: room_view

development:
  edit_mode: false
  show_walkboxes: false
  show_hotspots: false
  show_anchors: false
  show_state: false
  allow_room_reload: false

scenes:
  - id: title
    type: TitleScreen
    parameters:
      background: title/title_screen.png
      music: music/title.mp3
      font: fonts/DepartureMono-Regular.otf
      font_size: 30
      menu:
        position: {x: 0.5, y: 0.8}
        options:
          new_game: act1_intro
          continue: room_view
          # Optional load-picker entry on the title (#108). Any non-empty
          # value enables it; the picker's actual goto target is set by the
          # `room_scene:` parameter on the `load` scene below.
          load_game: room_view
          exit: QUIT

  - id: settings
    type: SettingsScene
    parameters:
      background: settings/settings.png
      font: fonts/DepartureMono-Regular.otf
      font_size: 20

  - id: save
    type: SaveLoadScene
    parameters:
      mode: save
      background: title/title_screen.png
      font: fonts/DepartureMono-Regular.otf
      font_size: 22

  - id: load
    type: SaveLoadScene
    parameters:
      mode: load
      background: title/title_screen.png
      font: fonts/DepartureMono-Regular.otf
      font_size: 22

  - id: room_view
    type: RoomScene
    parameters:
      cast: cast.yaml
      rooms: rooms
      start_room: lab
      player: player
      scumm_panel: ui/scumm_panel_default.yml
      font: fonts/DepartureMono-Regular.otf
      logic: scripts/game.lua
      inventory: inventory/inventory.yaml
      inventory_logic: inventory/inventory.lua
      pause_menu:
        overlays:
          notebook:
            scene: notebook
            label_key: notebook
            order: 30

  - id: notebook
    type: IngresoNotebook
    parameters:
      data: notebook/notebook.yaml

  # -------------------------------------------------------------------------------
  # ACTO I. 
  # -------------------------------------------------------------------------------

  # Cutscenes

  - id: act1_intro
    type: Cutscene
    parameters:
      data: cutscenes/act1_intro.yaml
      on_finish: room_view
      font: fonts/DepartureMono-Regular.otf

  - id: act1_outro
    type: Cutscene
    parameters:
      data: cutscenes/act1_outro.yaml
      # act2_intro no existe aún, así que volvemos a room_view por ahora
      on_finish: room_view
      font: fonts/DepartureMono-Regular.otf
  
  # Close-ups
  - id: window_llamas
    type: CloseUp
    parameters:
      data: closeups/window_llamas/closeup.yml
      logic: closeups/window_llamas/logic.lua    # scripted hotspots (talk in steps, set state)
      cast: cast.yaml                  # speech colours for talk()
      font: fonts/DepartureMono-Regular.otf        
  - id: lab_skull_closeup
    type: CloseUp
    parameters:
      data: closeups/lab_skull/closeup.yml
      logic: closeups/lab_skull/logic.lua    # scripted hotspots (talk in steps, set state)
      cast: cast.yaml                  # speech colours for talk()
      font: fonts/DepartureMono-Regular.otf
  - id: lab_chalkboard
    type: CloseUp
    parameters:
      data: closeups/lab_chalkboard/closeup.yml
      logic: closeups/lab_chalkboard/logic.lua    # scripted hotspots (talk in steps, set state)
      cast: cast.yaml                  # speech colours for talk()
      font: fonts/DepartureMono-Regular.otf
  - id: lab_notebook1
    type: CloseUp
    parameters:
      data: closeups/lab_notebook1/closeup.yml
      logic: closeups/lab_notebook1/logic.lua    # scripted hotspots (talk in steps, set state)
      cast: cast.yaml                  # speech colours for talk()
      font: fonts/DepartureMono-Regular.otf  
  - id: lab_notebook2
    type: CloseUp
    parameters:
      data: closeups/lab_notebook2/closeup.yml
      logic: closeups/lab_notebook2/logic.lua    # scripted hotspots (talk in steps, set state)
      cast: cast.yaml                  # speech colours for talk()
      font: fonts/DepartureMono-Regular.otf
