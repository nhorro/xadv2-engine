    tags: [matilde, perimortem]

hypotheses:
  - id: camelid_classification
    title: "Clasificación de camélidos"
    template: classification
    evidence_tags: [camelid]
    subjects:
      - id: camelid1
        label: "Camélido 1"
        evidence_tags: [camelid1]
        options: &camelid_options
          - { id: llama, label: "Llama" }
          - { id: alpaca, label: "Alpaca" }
          - { id: indeterminado, label: "Indeterminado" }
      - { id: camelid2, label: "Camélido 2", evidence_tags: [camelid2], options: *camelid_options }
      - { id: camelid3, label: "Camélido 3", evidence_tags: [camelid3], options: *camelid_options }
      - { id: camelid4, label: "Camélido 4", evidence_tags: [camelid4], options: *camelid_options }
      - { id: camelid5, label: "Camélido 5", evidence_tags: [camelid5], options: *camelid_options }
      - { id: camelid6, label: "Camélido 6", evidence_tags: [camelid6], options: *camelid_options }

  - id: matilde_trauma
    title: "Trauma de La Matilde"
    template: argument
    conclusions:
      - { id: blunt_perimortem, label: "Trauma contundente perimortem" }
      - { id: sharp_force, label: "Trauma por herramienta filosa" }
      - { id: postdepositional, label: "Daño postdepositacional" }
    premises:
      - { id: fracture_pattern, label: "Patrón de fractura", evidence_tags: [fracture_pattern] }
      - { id: no_cut_marks, label: "Ausencia de marcas de corte", evidence_tags: [no_cut_marks] }
      - { id: no_collapse, label: "Ausencia de derrumbe", evidence_tags: [no_collapse] }
      - { id: perimortem, label: "Interpretación perimortem", evidence_tags: [perimortem] }
      - { id: context, label: "Contexto complementario", evidence_tags: [context], required: false }
      - { id: artifact, label: "Objeto compatible", evidence_tags: [artifact], required: false }
